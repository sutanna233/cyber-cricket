# 赛博斗蛐蛐 · nginx 反向代理示例
# 用法：把 server_name 改成你的域名，证书路径改成你自己的，然后 include 进 http{} 里。
# 要点：静态与游戏本体都走 Node（认证头与模式注入由 Node 负责，不要用 nginx 直接指静态目录）。

upstream cyber_cricket {
    server 127.0.0.1:8130;
    keepalive 16;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name cricket.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cricket.example.com;

    ssl_certificate     /etc/letsencrypt/live/cricket.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cricket.example.com/privkey.pem;

    # 音频/贴图总量 ~6MB，开 gzip 由 Node 自己做；这里只加上限与超时
    client_max_body_size 1m;
    proxy_read_timeout 30s;

    # 只允许游戏本身需要的路径（白名单二道保险）
    location / {
        proxy_pass http://cyber_cricket;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # 登录接口：限速，防爆破
    location /api/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://cyber_cricket;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源交给浏览器长缓存
    location ~* ^/(js|assets)/ {
        proxy_pass http://cyber_cricket;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    access_log /var/log/nginx/cyber-cricket.access.log;
    error_log  /var/log/nginx/cyber-cricket.error.log warn;
}

# 放在 http{} 里：limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
